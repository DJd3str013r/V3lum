id: example-path-traversal-detect
info:
  name: Example Path Traversal Detect
  author: redacted
  severity: high
  metadata:
    max-request: 1
  tags: exposure
http:
  - method: GET
    path:
      - "{{BaseURL}}/static/../../etc/hostname"
    matchers:
      - type: status
        status:
          - 200
