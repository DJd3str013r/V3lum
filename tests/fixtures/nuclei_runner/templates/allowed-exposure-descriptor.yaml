id: git-config
info:
  name: Git Configuration - Detect
  author: redacted
  severity: medium
  description: Git configuration was detected via the pattern /.git/config on passed URLs.
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: config,git,exposure
http:
  - method: GET
    path:
      - "{{BaseURL}}/.git/config"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "[core]"
      - type: status
        status:
          - 200
