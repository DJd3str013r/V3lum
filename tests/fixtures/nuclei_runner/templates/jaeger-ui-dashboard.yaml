id: jaeger-ui-dashboard
info:
  name: Jaeger UI
  author: redacted
  severity: low
  description: Jaeger UI dashboard is exposed.
  metadata:
    max-request: 1
  tags: misconfig,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}/search'
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "<title>jaeger ui", "jaeger-query")'
        condition: and
